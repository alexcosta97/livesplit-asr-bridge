[package]
name = "livesplit-asr-bridge"
version = "0.0.0-dev"
edition = "2024"
rust-version = "1.95"
description = "Run LiveSplit auto splitters on one machine and control LiveSplit One on another over its Connect to Server WebSocket."
license = "MIT OR Apache-2.0"
repository = "https://github.com/alexcosta97/livesplit-asr-bridge"
readme = "README.md"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7.0.0"
eframe = "0.36.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink"] }
if-addrs = "0.15.0"
# The upstream runtime, from the livesplit-core repository by git rev: its only
# crates.io release (0.1.0) is from 2022. Renovate keeps the rev up to date.
livesplit-auto-splitting = { git = "https://github.com/LiveSplit/livesplit-core", rev = "a065a8d66c2c5151769cc7625f760724b5ea2413" }
# Names and extensions of MIME type file filters, as LiveSplit finds them.
mime_guess = "2.0.5"
pollster = "1.0.0"
rfd = "0.17"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = { version = "1.1.6", features = ["preserve_order"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

# Embeds the icon and version information in the Windows .exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.31", default-features = false }

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect"] }
wat = "1"
