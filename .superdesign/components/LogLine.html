<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&family=Space+Mono:wght@400;700&display=swap"><style>body{background:#0B0B0C}</style>
<div class="flex gap-[16px] font-['Space_Mono'] text-[12px] leading-[1.9] px-[8px] -mx-[8px] rounded-[4px] border"
  :class="highlighted ? 'border-[#FF4D00] bg-[#1E1E21] py-[6px] my-[4px]' : 'border-transparent'">
  <span class="w-[92px] shrink-0 text-[#6B6B73]">{{ time }}</span>
  <span class="w-[110px] shrink-0 uppercase" :class="{ 'text-[#FF4D00]': category === 'auto splitter', 'text-[#7DD3FC]': category === 'connection', 'text-[#A1A1AA]': category === 'app', 'text-[#FF3B3B]': category === 'error' }">{{ category }}</span>
  <div class="min-w-0">
    <div class="text-[#F5F5F4]">{{ message }}</div>
    <div v-if="trace" class="text-[#6B6B73] whitespace-pre leading-[1.6]">{{ trace }}</div>
  </div>
</div>
