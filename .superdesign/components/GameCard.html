<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&family=Space+Mono:wght@400;700&display=swap"><style>body{background:#0B0B0C}</style>
<div class="rounded-[4px] border border-[#2A2A2E] p-[16px] flex flex-col gap-[4px]"
  :class="{ 'border-l-[3px] border-l-[#22E07A] bg-[#0C1813]': state === 'attached', 'bg-[#0B0B0C]': state !== 'attached' }">
  <div class="mb-[4px]"><sd-component componentId="d55b5404-6f47-4fa0-805f-1e1c2a45186b" name="SectionLabel" instance="sectionlabel" :props="JSON.stringify({text: 'Game'})"></sd-component></div>
  <div v-if="state === 'attached'" class="flex flex-col gap-[4px]">
    <div class="flex items-start" :class="size === 'compact' ? 'gap-[10px]' : 'gap-[8px]'">
    <span class="w-[8px] h-[8px] rounded-full shrink-0 bg-[#22E07A]" :class="size === 'compact' ? 'mt-[12px]' : 'mt-[7px]'"></span>
    <span class="font-['Archivo_Black'] uppercase tracking-[-0.02em] leading-[1.05] text-[#22E07A]" :class="size === 'compact' ? 'text-[30px]' : 'text-[20px]'">Attached</span>
  </div>
    <div class="font-['Space_Mono'] text-[12px] text-[#A1A1AA]">{{ process }}<span v-if="size === 'wide'"> · {{ tickRate }}</span></div>
  </div>
  <div v-if="state === 'waiting'" class="flex flex-col gap-[4px]">
    <div class="flex items-start" :class="size === 'compact' ? 'gap-[10px]' : 'gap-[8px]'">
    <span class="w-[8px] h-[8px] rounded-full shrink-0 border border-[#A1A1AA]" :class="size === 'compact' ? 'mt-[12px]' : 'mt-[7px]'"></span>
    <span class="font-['Archivo_Black'] uppercase tracking-[-0.02em] leading-[1.05] text-[#A1A1AA]" :class="size === 'compact' ? 'text-[30px]' : 'text-[20px]'">Waiting for game…</span>
  </div>
    <div class="font-['Inter'] text-[13px] text-[#A1A1AA]">Start the game. This is normal before a run.</div>
  </div>
  <div v-if="state === 'stopped'" class="flex flex-col gap-[4px]">
    <div class="flex items-start" :class="size === 'compact' ? 'gap-[10px]' : 'gap-[8px]'">
    <span class="w-[8px] h-[8px] rounded-full shrink-0 border border-[#A1A1AA]" :class="size === 'compact' ? 'mt-[12px]' : 'mt-[7px]'"></span>
    <span class="font-['Archivo_Black'] uppercase tracking-[-0.02em] leading-[1.05] text-[#A1A1AA]" :class="size === 'compact' ? 'text-[30px]' : 'text-[20px]'">Stopped</span>
  </div>
    <div class="font-['Inter'] text-[13px] text-[#A1A1AA]">The auto splitter isn't running</div>
  </div>
  <div v-if="state === 'none'" class="flex flex-col gap-[4px]">
    <div class="font-['Archivo_Black'] uppercase tracking-[-0.02em] leading-none text-[#6B6B73]" :class="size === 'compact' ? 'text-[30px]' : 'text-[20px]'">—</div>
    <div class="font-['Inter'] text-[13px] text-[#A1A1AA]">Load an auto splitter first</div>
  </div>
</div>
