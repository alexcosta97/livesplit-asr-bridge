<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&family=Space+Mono:wght@400;700&display=swap"><style>body{background:#0B0B0C}</style>
<div class="rounded-[4px] border border-[#2A2A2E] p-[16px] flex flex-col gap-[4px]"
  :class="{ 'border-l-[3px] border-l-[#22E07A] bg-[#0C1813]': state === 'connected', 'bg-[#0B0B0C]': state !== 'connected' }">
  <div class="mb-[4px]"><sd-component componentId="d55b5404-6f47-4fa0-805f-1e1c2a45186b" name="SectionLabel" instance="sectionlabel" :props="JSON.stringify({text: 'Timer'})"></sd-component></div>
  <div v-if="state === 'connected'" class="flex flex-col gap-[4px]">
    <div class="flex items-start" :class="size === 'compact' ? 'gap-[10px]' : 'gap-[8px]'">
    <span class="w-[8px] h-[8px] rounded-full shrink-0 bg-[#22E07A]" :class="size === 'compact' ? 'mt-[12px]' : 'mt-[7px]'"></span>
    <span class="font-['Archivo_Black'] uppercase tracking-[-0.02em] leading-[1.05] text-[#22E07A]" :class="size === 'compact' ? 'text-[30px]' : 'text-[20px]'">Connected</span>
  </div>
    <div class="font-['Space_Mono'] text-[12px] text-[#A1A1AA]">{{ timers }} {{ timers === 1 ? 'timer' : 'timers' }} · LiveSplit One</div>
    <div v-if="size === 'wide'" class="flex items-center justify-between gap-[8px] mt-[8px]">
      <span class="font-['Space_Mono'] text-[12px] text-[#A1A1AA]">Addresses: Connection tab</span>
      <sd-component componentId="5794552b-71ba-4a29-a620-eaa6e886b681" name="Btn" instance="help" :props="JSON.stringify({label: '?', size: 'xs'})"></sd-component>
    </div>
  </div>
  <div v-if="state === 'notConnected'" class="flex flex-col gap-[4px]">
    <div class="flex items-start" :class="size === 'compact' ? 'gap-[10px]' : 'gap-[8px]'">
    <span class="w-[8px] h-[8px] rounded-full shrink-0 border border-[#A1A1AA]" :class="size === 'compact' ? 'mt-[12px]' : 'mt-[7px]'"></span>
    <span class="font-['Archivo_Black'] uppercase tracking-[-0.02em] leading-[1.05] text-[#A1A1AA]" :class="size === 'compact' ? 'text-[30px]' : 'text-[20px]'">Not connected</span>
  </div>
    <a href="#how-to-connect" id="how-to-connect-link" class="font-['Inter'] text-[13px] font-semibold text-[#FF4D00] hover:underline">How do I connect?</a>
    <div class="h-px bg-[#2A2A2E] my-[8px]"></div>
    <div class="flex flex-col gap-[8px]">
      <sd-component componentId="f5d47feb-9c19-4ebc-bbd3-8ecabbe16d65" name="AddressRow" instance="lan" :props="JSON.stringify({tag: 'LAN', url: lanUrl, size: size})"></sd-component>
      <sd-component v-if="size === 'wide' && vpnUrl" componentId="f5d47feb-9c19-4ebc-bbd3-8ecabbe16d65" name="AddressRow" instance="vpn" :props="JSON.stringify({tag: 'VPN', url: vpnUrl, size: size})"></sd-component>
    </div>
  </div>
  <div v-if="state === 'serverStopped'" class="flex flex-col gap-[4px]">
    <div class="flex items-start" :class="size === 'compact' ? 'gap-[10px]' : 'gap-[8px]'">
    <span class="w-[8px] h-[8px] rounded-full shrink-0 border border-[#A1A1AA]" :class="size === 'compact' ? 'mt-[12px]' : 'mt-[7px]'"></span>
    <span class="font-['Archivo_Black'] uppercase tracking-[-0.02em] leading-[1.05] text-[#A1A1AA]" :class="size === 'compact' ? 'text-[30px]' : 'text-[20px]'">Server stopped</span>
  </div>
    <div class="font-['Inter'] text-[13px] text-[#A1A1AA]">No timer can connect until the server restarts</div>
  </div>
</div>
