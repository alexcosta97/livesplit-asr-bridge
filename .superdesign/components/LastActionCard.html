<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&family=Space+Mono:wght@400;700&display=swap"><style>body{background:#0B0B0C}</style>
<div class="rounded-[4px] border border-[#2A2A2E] bg-[#0B0B0C] p-[16px] flex flex-col gap-[4px]"
  :class="{ 'border-l-[3px] border-l-[#FF4D00]': state === 'action' }">
  <div class="flex items-center justify-between mb-[4px]">
    <sd-component componentId="d55b5404-6f47-4fa0-805f-1e1c2a45186b" name="SectionLabel" instance="sectionlabel" :props="JSON.stringify({text: 'Last action'})"></sd-component>
    <span v-if="state === 'action'" class="font-['Space_Mono'] text-[12px] text-[#6B6B73]">{{ time }}</span>
  </div>
  <div v-if="state === 'action'" class="flex flex-col gap-[4px]">
    <div class="font-['Archivo_Black'] uppercase tracking-[-0.02em] leading-none text-[#FF4D00]" :class="size === 'compact' ? 'text-[30px]' : 'text-[24px]'">{{ action }}</div>
    <div v-if="segment" class="font-['Inter'] font-semibold text-[#F5F5F4] truncate" :class="size === 'compact' ? 'text-[16px]' : 'text-[14px]'">{{ segment }}</div>
    <div v-if="notSent" class="font-['Space_Mono'] text-[12px] text-[#FFC233]">Not sent: no timer connected</div>
    <div class="flex flex-col gap-[4px] mt-[8px]">
      <div v-if="previous1" class="font-['Space_Mono'] text-[12px] text-[#6B6B73] whitespace-pre truncate">{{ previous1 }}</div>
      <div v-if="previous2" class="font-['Space_Mono'] text-[12px] text-[#6B6B73] whitespace-pre truncate">{{ previous2 }}</div>
    </div>
  </div>
  <div v-if="state === 'empty'" class="flex flex-col gap-[4px]">
    <div class="font-['Archivo_Black'] uppercase tracking-[-0.02em] leading-none text-[#6B6B73]" :class="size === 'compact' ? 'text-[30px]' : 'text-[20px]'">No actions yet</div>
    <div class="font-['Inter'] text-[13px] text-[#A1A1AA] leading-snug mt-[4px]">Actions appear here when the auto splitter starts, splits or resets.</div>
  </div>
</div>
