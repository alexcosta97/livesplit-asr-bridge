<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&family=Space+Mono:wght@400;700&display=swap"><style>body{background:#0B0B0C}</style>
<div class="rounded-[4px] border border-[#2A2A2E] border-l-[3px] border-l-[#FF3B3B] bg-[#1A0E0F] p-[16px] flex flex-col gap-[12px]">
  <div class="flex items-center gap-[8px]">
    <span class="w-[8px] h-[8px] rounded-full bg-[#FF3B3B]"></span>
    <span class="font-['Archivo_Black'] uppercase tracking-[-0.02em] text-[#FF3B3B] leading-none" :class="{ 'text-[20px]': size === 'wide', 'text-[30px]': size === 'compact' }">Error</span>
  </div>
  <div class="font-['Inter'] text-[#F5F5F4] leading-[1.45]" :class="{ 'text-[13px]': size === 'wide', 'text-[14px]': size === 'compact' }">
    <span v-if="kind === 'crashed'">The auto splitter stopped because of an error. Press Reload to start it again.</span>
    <span v-if="kind === 'loadFailed'">Couldn't load {{ fileName }}: not a valid WebAssembly module. The previous auto splitter is still running.</span>
    <span v-if="kind === 'portInUse'">Port {{ port }} is already in use. Choose another port in Connection and restart the server.</span>
  </div>
  <div class="flex flex-wrap gap-[6px]">
    <sd-component v-if="kind !== 'portInUse'" componentId="5794552b-71ba-4a29-a620-eaa6e886b681" name="Btn" instance="showlog" :props="JSON.stringify({label: 'Show in log', size: 'sm'})"></sd-component>
    <sd-component v-if="kind === 'crashed'" componentId="5794552b-71ba-4a29-a620-eaa6e886b681" name="Btn" instance="reload" :props="JSON.stringify({label: 'Reload', size: 'sm'})"></sd-component>
    <sd-component v-if="kind === 'portInUse'" componentId="5794552b-71ba-4a29-a620-eaa6e886b681" name="Btn" instance="openconn" :props="JSON.stringify({label: 'Open Connection', size: 'sm'})"></sd-component>
    <sd-component componentId="5794552b-71ba-4a29-a620-eaa6e886b681" name="Btn" instance="dismiss" :props="JSON.stringify({label: 'Dismiss', size: 'sm'})"></sd-component>
  </div>
</div>
