name: Task
description: A well-defined piece of work, such as a backlog item.
labels: ["task"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What needs to be done, in a sentence or two.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: >-
        Context, scope and anything out of scope. Link the relevant section of
        the design spec where there is one.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How to tell the work is done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
