name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in the app, e.g. 0.4.0 or 0.4.0-rc.2
        required: true
        type: string
      ref:
        description: Commit to build
        required: true
        type: string
      artifact-name:
        description: Prefix for the uploaded artifacts
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        env:
          LIVESPLIT_ASR_BRIDGE_VERSION: ${{ inputs.version }}
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.target }} ${{ inputs.version }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
